services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_PATH: /app/data/leads.db
    volumes:
      - lead-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lead-data:
